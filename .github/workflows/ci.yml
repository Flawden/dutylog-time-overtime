name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.node-version'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Vue frontend typecheck, unit tests and build
        run: bash ./deploy/scripts/frontend-gate.sh


      - name: Resolve project version
        id: version
        shell: bash
        run: echo "release_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Build, test and coverage report
        run: mvn -B --no-transfer-progress verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Release static checks
        run: bash ./deploy/scripts/release-check.sh

      - name: Install Playwright test runner
        run: bash ./deploy/scripts/npm-ci-with-retry.sh

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

      - name: Build deployment image
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --build-arg DUTYLOG_BUILD_ID="ci-${GITHUB_SHA::12}" \
            --build-arg DUTYLOG_BUILD_VERSION="${{ steps.version.outputs.release_version }}-ci.${GITHUB_RUN_NUMBER}" \
            --build-arg DUTYLOG_BUILD_COMMIT="$GITHUB_SHA" \
            --build-arg DUTYLOG_BUILD_TREE="$(git rev-parse HEAD^{tree})" \
            --build-arg DUTYLOG_BUILD_TIME="${BUILD_TIME:-unknown}" \
            --build-arg DUTYLOG_SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t dutylog:ci .

      - name: Clean PostgreSQL migration smoke test
        run: bash ./deploy/scripts/migration-smoke-test.sh dutylog:ci
