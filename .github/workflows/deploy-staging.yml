name: Deploy staging

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dutylog-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Tests
        run: mvn -B --no-transfer-progress test
      - name: Release checks
        run: bash ./deploy/scripts/release-check.sh

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Require test branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/test" ]]; then
            echo "This workflow may deploy only refs/heads/test." >&2
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute immutable artifact identity
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          SHORT_TREE="${TREE_SHA:0:12}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
          echo "build_version=27.2.2+tree.$SHORT_TREE" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:tree-${{ steps.meta.outputs.tree_sha }}
            ${{ steps.meta.outputs.image_name }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image_name }}:staging-latest
          build-args: |
            DUTYLOG_BUILD_ID=tree-${{ steps.meta.outputs.tree_sha }}
            DUTYLOG_BUILD_VERSION=${{ steps.meta.outputs.build_version }}
            DUTYLOG_BUILD_COMMIT=${{ github.sha }}
            DUTYLOG_BUILD_TREE=${{ steps.meta.outputs.tree_sha }}
            DUTYLOG_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            DUTYLOG_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the exact image on clean PostgreSQL
        run: |
          IMAGE_REF="${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE_REF"
          bash deploy/scripts/migration-smoke-test.sh "$IMAGE_REF"

      - name: Deploy to staging and run smoke tests
        env:
          DUTYLOG_DEPLOY_HOST: ${{ vars.DUTYLOG_DEPLOY_HOST }}
          DUTYLOG_DEPLOY_PORT: ${{ vars.DUTYLOG_DEPLOY_PORT }}
          DUTYLOG_DEPLOY_USER: ${{ vars.DUTYLOG_DEPLOY_USER }}
          DUTYLOG_DEPLOY_PATH: ${{ vars.DUTYLOG_DEPLOY_PATH }}
          DUTYLOG_BASE_URL: ${{ vars.DUTYLOG_BASE_URL }}
          DUTYLOG_SSH_PRIVATE_KEY: ${{ secrets.DUTYLOG_SSH_PRIVATE_KEY }}
          DUTYLOG_SSH_KNOWN_HOSTS: ${{ secrets.DUTYLOG_SSH_KNOWN_HOSTS }}
          DUTYLOG_GHCR_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          DUTYLOG_GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DUTYLOG_DEPLOY_ENVIRONMENT: staging
          DUTYLOG_IMAGE_REF: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
          DUTYLOG_RELEASE_VERSION: 27.2.2
          DUTYLOG_BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          DUTYLOG_BUILD_TREE: ${{ steps.meta.outputs.tree_sha }}
          DUTYLOG_BUILD_COMMIT: ${{ github.sha }}
          DUTYLOG_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: bash deploy/scripts/remote-deploy.sh

      - name: Mark the exact image as staging-tested
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.image_name }}:staging-tested-tree-${{ steps.meta.outputs.tree_sha }}" \
            "${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}"
