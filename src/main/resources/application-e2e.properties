# Isolated browser E2E profile. It never touches the local file database.
spring.datasource.url=jdbc:h2:mem:dutylog_e2e;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=false

server.port=4173

# Browser tests create disposable USER accounts through the real registration flow.
dutylog.registration.default-enabled=true
dutylog.security.rate-limit.enabled=false

# External integrations stay off in E2E; their Java contracts are tested separately.
dutylog.telegram.enabled=false
dutylog.telegram.polling-enabled=false
dutylog.telegram.notifications-enabled=false

# Keep scheduled maintenance away from the short browser suite.
dutylog.mobile.sync.cleanup-delay-ms=86400000

# Reduce CI noise while retaining warnings and failures.
logging.level.root=WARN
logging.level.ru.daniil.shifts=INFO
