# Профиль для первого выкладывания наружу.
# Запуск: mvn spring-boot:run -Dspring-boot.run.profiles=prod

# H2-console нельзя оставлять открытой на публичном сервере.
spring.h2.console.enabled=false

# Если приложение стоит за nginx/прокси, Spring будет корректнее понимать HTTPS-заголовки.
server.forward-headers-strategy=framework
