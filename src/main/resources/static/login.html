<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — DutyLog: Time & Overtime</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B1118">
<style>
  :root {
    --bg:#14171C; --panel:#1C2027; --panel2:#22262E; --line:#2E333C;
    --text:#E8EAED; --mut:#8B929E; --dim:#5A6270; --accent:#F5B841; --danger:#E0653A; --ok:#6FBF73;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text);
    background:radial-gradient(circle at 15% 5%,rgba(245,184,65,.10),transparent 28rem),radial-gradient(circle at 90% 85%,rgba(54,116,153,.12),transparent 30rem),linear-gradient(180deg,#081019,var(--bg));
    font-family:Inter,'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:410px; background:linear-gradient(145deg,rgba(28,32,39,.97),rgba(34,38,46,.90)); border:1px solid #344050; border-radius:24px; padding:24px; box-shadow:0 28px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04); backdrop-filter:blur(18px); }
  .loginBrand { display:flex; align-items:center; gap:12px; margin:2px 0 18px; }
  .loginBrandMark { width:46px; height:46px; display:grid; place-items:center; border-radius:14px; color:var(--accent); background:rgba(245,184,65,.10); border:1px solid rgba(245,184,65,.38); box-shadow:0 0 28px rgba(245,184,65,.12); }
  .loginBrandMark svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .loginBrandCopy { display:grid; line-height:1.05; }
  .loginBrandCopy strong { font-size:22px; letter-spacing:-.5px; }
  .loginBrandCopy strong span { color:var(--accent); }
  .loginBrandCopy small { margin-top:5px; color:var(--mut); font:9px ui-monospace,monospace; letter-spacing:2.4px; text-transform:uppercase; }
  .eyebrow { font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; font-family:ui-monospace,monospace; }
  h1 { font-size:24px; font-weight:800; margin:2px 0 16px; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:none; cursor:pointer; padding:8px 12px; font-size:14px;
    color:var(--dim); border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit; }
  .tabs button.on { color:var(--text); font-weight:700; border-bottom-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; background:rgba(8,14,21,.76); border:1px solid #354151; border-radius:12px;
    color:var(--text); padding:11px 12px; font-size:14px; font-family:inherit; }
  input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .btn { width:100%; margin-top:16px; background:linear-gradient(135deg,#FFD55A,var(--accent)); color:#14171C; border:1px solid rgba(255,224,130,.55);
    border-radius:12px; padding:11px; font-size:14px; font-weight:850; cursor:pointer; font-family:inherit; box-shadow:0 10px 26px rgba(245,184,65,.16); }
  .btn:disabled { background:var(--line); color:var(--dim); cursor:default; }
  .msg { min-height:18px; margin-top:10px; font-size:12.5px; }
  .hint { margin-top:10px; color:var(--dim); font-size:12px; line-height:1.35; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .loginLang { display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px; }
  .loginLang button { border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:999px; padding:5px 9px; cursor:pointer; font-family:inherit; font-weight:700; }
  .loginLang button.on { color:#14171C; background:var(--accent); border-color:var(--accent); }
  .rememberRow { display:flex; align-items:flex-start; gap:9px; margin:12px 0 0; color:var(--mut); font-size:12.5px; line-height:1.35; cursor:pointer; }
  .rememberRow input { width:17px; height:17px; margin:1px 0 0; padding:0; flex:0 0 auto; accent-color:var(--accent); }
  .rememberRow span { display:block; }
  .rememberRow small { display:block; color:var(--dim); margin-top:2px; font-size:11px; }
</style>
</head>
<body>
<div class="card">
  <div class="loginLang"><button type="button" data-login-lang="ru">RU</button><button type="button" data-login-lang="en">EN</button></div>
  <div class="loginBrand">
    <span class="loginBrandMark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3.5 27 8.9v9.2L16 28.5 5 18.1V8.9Z"/><path d="m10.4 15.8 3.6 3.6 7.9-8"/><path d="M16 7.5v3.2"/></svg></span>
    <span class="loginBrandCopy"><strong>Duty<span>Log</span></strong><small>Time &amp; Overtime</small></span>
  </div>
  <h1 id="title">Вход</h1>

  <div class="tabs">
    <button id="tabLogin" class="on">Вход</button>
    <button id="tabReg">Регистрация</button>
  </div>

  <!-- Форма входа: обычный POST, его обрабатывает Spring Security -->
  <form id="loginForm" method="post" action="/perform_login">
    <input type="hidden" name="_csrf" id="csrfField">
    <label for="lu">Имя пользователя</label>
    <input id="lu" name="username" autocomplete="username" required>
    <label for="lp">Пароль</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <label class="rememberRow" for="rememberMe">
      <input id="rememberMe" name="remember-me" type="checkbox" value="true" checked>
      <span id="rememberText">Запомнить меня на этом устройстве<small id="rememberHint">Вход сохранится на 30 дней. Кнопка «Выйти» завершит его сразу.</small></span>
    </label>
    <button class="btn" type="submit">Войти</button>
  </form>

  <!-- Форма регистрации: fetch на /api/auth/register, потом автологин -->
  <form id="regForm" hidden>
    <label for="ru">Имя пользователя <span style="color:var(--dim)">(от 3 символов)</span></label>
    <input id="ru" autocomplete="username" required>
    <label for="rp">Пароль <span style="color:var(--dim)">(от 8 символов)</span></label>
    <input id="rp" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit" id="regBtn">Создать аккаунт</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="hint" id="regStatusHint"></div>
</div>

<script src="/js/login.js?v=27.40.24" defer></script>
</body>
</html>
