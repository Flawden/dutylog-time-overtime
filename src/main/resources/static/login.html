<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — DutyLog: Time & Overtime</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14171C">
<style>
  :root {
    --bg:#14171C; --panel:#1C2027; --panel2:#22262E; --line:#2E333C;
    --text:#E8EAED; --mut:#8B929E; --dim:#5A6270; --accent:#F5B841; --danger:#E0653A; --ok:#6FBF73;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .eyebrow { font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; font-family:ui-monospace,monospace; }
  h1 { font-size:24px; font-weight:800; margin:2px 0 16px; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:none; cursor:pointer; padding:8px 12px; font-size:14px;
    color:var(--dim); border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit; }
  .tabs button.on { color:var(--text); font-weight:700; border-bottom-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:9px 11px; font-size:14px; font-family:inherit; }
  input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .btn { width:100%; margin-top:16px; background:var(--accent); color:#14171C; border:none;
    border-radius:8px; padding:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn:disabled { background:var(--line); color:var(--dim); cursor:default; }
  .msg { min-height:18px; margin-top:10px; font-size:12.5px; }
  .hint { margin-top:10px; color:var(--dim); font-size:12px; line-height:1.35; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .loginLang { display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px; }
  .loginLang button { border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:999px; padding:5px 9px; cursor:pointer; font-family:inherit; font-weight:700; }
  .loginLang button.on { color:#14171C; background:var(--accent); border-color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="loginLang"><button type="button" data-login-lang="ru">RU</button><button type="button" data-login-lang="en">EN</button></div>
  <div class="eyebrow">DutyLog: Time & Overtime</div>
  <h1 id="title">Вход</h1>

  <div class="tabs">
    <button id="tabLogin" class="on">Вход</button>
    <button id="tabReg">Регистрация</button>
  </div>

  <!-- Форма входа: обычный POST, его обрабатывает Spring Security -->
  <form id="loginForm" method="post" action="/perform_login">
    <input type="hidden" name="_csrf" id="csrfField">
    <label for="lu">Имя пользователя</label>
    <input id="lu" name="username" autocomplete="username" required>
    <label for="lp">Пароль</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Войти</button>
  </form>

  <!-- Форма регистрации: fetch на /api/auth/register, потом автологин -->
  <form id="regForm" hidden>
    <label for="ru">Имя пользователя <span style="color:var(--dim)">(от 3 символов)</span></label>
    <input id="ru" autocomplete="username" required>
    <label for="rp">Пароль <span style="color:var(--dim)">(от 6 символов)</span></label>
    <input id="rp" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit" id="regBtn">Создать аккаунт</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="hint" id="regStatusHint"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LANGUAGE_KEY = "dutylog.language.v1";
const L_EN = {
  "Вход":"Login", "Регистрация":"Registration", "Имя пользователя":"Username", "Пароль":"Password", "Войти":"Sign in", "Создать аккаунт":"Create account", "Имя пользователя (от 3 символов)":"Username (min. 3 characters)", "Пароль (от 6 символов)":"Password (min. 6 characters)", "Неверное имя или пароль":"Invalid username or password", "Регистрация закрыта администратором":"Registration is closed by administrator", "Публичная регистрация закрыта администратором. Войдите в существующий аккаунт.":"Public registration is closed by administrator. Sign in to an existing account.", "Создаю аккаунт…":"Creating account…", "Готово, вхожу…":"Done, signing in…", "Сеть недоступна":"Network unavailable"
};
const L_RU = Object.fromEntries(Object.entries(L_EN).map(([ru,en]) => [en, ru]));
function loginLang(){ try { return (localStorage.getItem(LANGUAGE_KEY) || (navigator.language || "").slice(0,2)) === "en" ? "en" : "ru"; } catch (_) { return "ru"; } }
let currentLang = loginLang();
function lt(s){ return currentLang === "en" ? (L_EN[s] || s) : (L_RU[s] || s); }
function applyLoginLanguage(lang){
  currentLang = lang === "en" ? "en" : "ru";
  try { localStorage.setItem(LANGUAGE_KEY, currentLang); } catch (_) {}
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-login-lang]').forEach(b => b.classList.toggle('on', b.dataset.loginLang === currentLang));
  const pairs = [["title", "Вход"], ["tabLogin", "Вход"], ["tabReg", "Регистрация"]];
  for (const [id, ru] of pairs) if ($(id)) $(id).textContent = lt(ru);
  document.querySelector('label[for="lu"]').textContent = lt("Имя пользователя");
  document.querySelector('label[for="lp"]').textContent = lt("Пароль");
  document.querySelector('#loginForm .btn').textContent = lt("Войти");
  document.querySelector('label[for="ru"]').innerHTML = currentLang === 'en' ? 'Username <span style="color:var(--dim)">(min. 3 characters)</span>' : 'Имя пользователя <span style="color:var(--dim)">(от 3 символов)</span>';
  document.querySelector('label[for="rp"]').innerHTML = currentLang === 'en' ? 'Password <span style="color:var(--dim)">(min. 6 characters)</span>' : 'Пароль <span style="color:var(--dim)">(от 6 символов)</span>';
  $("regBtn").textContent = lt("Создать аккаунт");
}
document.querySelectorAll('[data-login-lang]').forEach(b => b.addEventListener('click', () => applyLoginLanguage(b.dataset.loginLang)));

/* CSRF: Spring кладёт токен в cookie XSRF-TOKEN при загрузке страницы */
function csrfToken(){
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
async function ensureCsrf(){
  if (!csrfToken()) {
    // cookie нет (например, страница пришла из кэша service worker) —
    // тихо дёргаем сервер напрямую, он поставит XSRF-TOKEN
    try { await fetch("/login.html", { cache: "no-store", credentials: "same-origin" }); } catch (e) {}
  }
  return csrfToken();
}
ensureCsrf().then(t => { $("csrfField").value = t || ""; });

let registrationEnabled = true;
async function loadRegistrationStatus(){
  try {
    const res = await fetch("/api/auth/registration-status", { cache:"no-store", credentials:"same-origin" });
    if (!res.ok) return;
    const data = await res.json();
    registrationEnabled = data.enabled !== false;
  } catch (e) {
    // Backend всё равно проверит POST. Если статус не загрузился, не ломаем вход.
    registrationEnabled = true;
  }
  applyRegistrationStatus();
}
function applyRegistrationStatus(){
  const closed = !registrationEnabled;
  $("tabReg").hidden = closed;
  $("regStatusHint").textContent = closed ? lt("Публичная регистрация закрыта администратором. Войдите в существующий аккаунт.") : "";
  if (closed) setTab(false);
}

$("loginForm").addEventListener("submit", (e) => {
  if (!csrfToken()) {
    // токена всё ещё нет — добываем и отправляем форму сами
    e.preventDefault();
    ensureCsrf().then(t => { $("csrfField").value = t || ""; $("loginForm").submit(); });
    return;
  }
  $("csrfField").value = csrfToken();
});

function setTab(reg) {
  if (reg && !registrationEnabled) {
    setMsg(lt("Регистрация закрыта администратором"), "err");
    return;
  }
  $("tabLogin").classList.toggle("on", !reg);
  $("tabReg").classList.toggle("on", reg);
  $("loginForm").hidden = reg;
  $("regForm").hidden = !reg;
  $("title").textContent = reg ? "Регистрация" : "Вход";
  setMsg("");
}
$("tabLogin").addEventListener("click", () => setTab(false));
$("tabReg").addEventListener("click", () => setTab(true));

function setMsg(text, cls) {
  const m = $("msg");
  m.textContent = text;
  m.className = "msg" + (cls ? " " + cls : "");
}

// ?error в URL — Spring Security вернул нас после неудачного входа
if (new URLSearchParams(location.search).has("error")) {
  setMsg(lt("Неверное имя или пароль"), "err");
}

$("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!registrationEnabled) {
    setMsg(lt("Регистрация закрыта администратором"), "err");
    return;
  }
  const username = $("ru").value.trim();
  const password = $("rp").value;
  $("regBtn").disabled = true;
  setMsg(lt("Создаю аккаунт…"));
  try {
    await ensureCsrf();
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": csrfToken() },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      setMsg(body.error || (currentLang === "en" ? `Error ${res.status}` : `Ошибка ${res.status}`), "err");
      $("regBtn").disabled = false;
      return;
    }
    // Аккаунт создан — входим теми же данными через обычную форму
    setMsg(lt("Готово, вхожу…"), "ok");
    $("lu").value = username;
    $("lp").value = password;
    $("csrfField").value = csrfToken();
    $("loginForm").submit();
  } catch (err) {
    setMsg(lt("Сеть недоступна"), "err");
    $("regBtn").disabled = false;
  }
});
applyLoginLanguage(currentLang);
loadRegistrationStatus();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
