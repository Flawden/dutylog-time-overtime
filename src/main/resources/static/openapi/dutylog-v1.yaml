        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    ApiError:
      description: Stable machine-readable error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AdminUser:
      type: object
      required: [id, username, displayName, role, accountTier, bootstrapAdmin, currentUser]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        accountTier: { type: string }
        bootstrapAdmin: { type: boolean }
        currentUser: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    AdminUserPage:
      type: object
      required: [items, page, size, total, totalPages, hasPrevious, hasNext]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    AdminUserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [USER, ADMIN] }
    AdminUserPasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 12 }
    AdminRegistrationSettings:
      type: object
      required: [enabled, mode, source]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [open, closed] }
        source: { type: string, enum: [database, default] }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }
    AdminRegistrationSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AdminDatabaseStatus:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string, nullable: true }
    AdminUserManagementStatus:
      type: object
      required: [total, admins, rolesAllowed, accountTiersReserved]
      properties:
        total: { type: integer, minimum: 0 }
        admins: { type: integer, minimum: 0 }
        rolesAllowed:
          type: array
          items: { type: string }
        accountTiersReserved:
          type: array
          items: { type: string }
    AdminTelegramStatus:
      type: object
      required: [enabled, tokenConfigured, pollingEnabled, notificationsEnabled, linked]
      properties:
        enabled: { type: boolean }
        tokenConfigured: { type: boolean }
        pollingEnabled: { type: boolean }
        notificationsEnabled: { type: boolean }
        configured: { type: boolean }
        linked: { type: boolean }
        accountNotificationsEnabled: { type: boolean }
        botUsername: { type: string, nullable: true }
    AdminSystemStatus:
      type: object
      required: [app, version, admin, serverTime, serverTimezone, profiles, database, users, registration, telegram]
      properties:
        app: { type: string }
        version: { type: string }
        admin: { type: string }
        serverTime: { type: string, format: date-time }
        serverTimezone: { type: string }
        profiles:
          type: array
          items: { type: string }
        database: { $ref: '#/components/schemas/AdminDatabaseStatus' }
        users: { $ref: '#/components/schemas/AdminUserManagementStatus' }
        registration: { $ref: '#/components/schemas/AdminRegistrationSettings' }
        telegram: { $ref: '#/components/schemas/AdminTelegramStatus' }
    CalendarSyncStatus:
      type: object
      required: [active, feedPastDays, feedFutureDays, entities]
      properties:
        active: { type: boolean }
        tokenHint: { type: string, nullable: true, description: Non-secret prefix/suffix hint only }
        createdAt: { type: string, format: date-time, nullable: true }
        rotatedAt: { type: string, format: date-time, nullable: true }
        feedPastDays: { type: integer, minimum: 0, maximum: 365 }
        feedFutureDays: { type: integer, minimum: 0, maximum: 365 }
        entities:
          type: array
          items: { type: string, enum: [shifts, tasks, important_events, absences] }
    CalendarSubscription:
      allOf:
        - $ref: '#/components/schemas/CalendarSyncStatus'
        - type: object
          required: [subscriptionUrl]
          properties:
            subscriptionUrl:
              type: string
              format: uri
              description: Returned only after issue/rotation; contains the raw bearer token and must be treated as a secret.
    VacationSettingsInput:
      type: object
      properties:
        annualAllowanceDays: { type: integer, minimum: 0, maximum: 366 }
        carryoverDays: { type: integer, minimum: 0, maximum: 366 }
        countMode: { type: string, enum: [CALENDAR_DAYS, WEEKDAYS] }
        workYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        workYearStartDay: { type: integer, minimum: 1, maximum: 28 }
        timeOffBalanceHours: { type: number, format: double, minimum: 0, maximum: 10000 }
        defaultTimeOffDayHours: { type: number, format: double, minimum: 0.25, maximum: 24 }
    TimeCompensationDay:
