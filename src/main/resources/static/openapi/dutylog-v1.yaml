openapi: 3.0.3
info:
  title: DutyLog Android API
  version: 1.0.0
  description: |
    Stable v1 contract for DutyLog Android clients. Existing fields are additive-only.
    Breaking changes require a new /api/v2 namespace.
servers:
  - url: https://app.example.com
security:
  - bearerAuth: []
paths:
  /api/v1/mobile/auth/registration-status:
    get:
      security: []
      operationId: registrationStatus
      responses:
        '200':
          description: Public registration switch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/mobile/auth/register:
    post:
      security: []
      operationId: registerMobileUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegisterRequest'
      responses:
        '201':
          description: User and first mobile session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/login:
    post:
      security: []
      operationId: loginMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: New access and refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/refresh:
    post:
      security: []
      operationId: refreshMobileToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/logout:
    post:
      security: []
      operationId: logoutMobile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, nullable: true }
      responses:
        '204': { description: Session revoked when a matching token is supplied }
  /api/v1/mobile/auth/me:
    get:
      operationId: mobileMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUser'
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/sessions:
    get:
      operationId: listMobileSessions
      responses:
        '200':
          description: Mobile devices/sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MobileSession' }
  /api/v1/mobile/auth/sessions/{id}:
    delete:
      operationId: revokeMobileSession
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/bootstrap:
    get:
      operationId: mobileBootstrap
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Profile and calendar aggregate for the requested range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileBootstrap'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/sync:
    post:
      operationId: syncMobileQueue
      description: |
        Applies idempotent offline operations. Reusing operationId returns
        ALREADY_APPLIED (or the original conflict/rejection) and never repeats a write.
        Version 0 means the target day does not exist; persisted rows start at version 1.
        A day object without any mutation is rejected with NO_CHANGES.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileSyncRequest'
      responses:
        '200':
          description: Per-operation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSyncResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/modules:
    get:
      operationId: listModules
      responses:
        '200': { description: User module contracts and enabled state }
    patch:
      operationId: updateModules
      responses:
        '200': { description: Updated module state }
  /api/v1/calendar:
    get:
      operationId: calendarRange
      description: Calendar aggregate including immutable dated shift occurrences projected into the current user timezone.
      responses:
        '200': { description: Calendar aggregate }
  /api/v1/shifts/legacy-migration/preview:
    get:
      operationId: previewLegacyShiftMigration
      parameters:
        - in: query
          name: sourceTimezone
          required: true
          schema: { type: string, example: Asia/Yekaterinburg }
      responses:
        '200':
          description: Legacy dated shifts interpreted in the selected source timezone without writing changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyShiftMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/shifts/legacy-migration:
    post:
      operationId: migrateLegacyShifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyShiftMigrationRequest' }
      responses:
        '200':
          description: Remaining legacy shifts after the selected occurrences were frozen as absolute intervals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyShiftMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/days/{date}:
    put:
      operationId: upsertDay
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: Updated day }
  /api/v1/notes:
    get:
      operationId: listDayNotes
      description: Lists independent notes for one date or an inclusive date range.
      parameters:
        - { in: query, name: date, required: false, schema: { type: string, format: date } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Ordered notes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }
        '400': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createDayNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteCreateRequest' }
      responses:
        '201':
          description: Created independent note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayNote' }
  /api/v1/notes/search:
    get:
      operationId: searchDayNotes
      description: Owner-scoped title/content search with optional inclusive date range.
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 40 } }
      responses:
        '200':
          description: Matching notes newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/notes/{id}:
    patch:
      operationId: updateDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteUpdateRequest' }
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayNote' }
        '404': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/notes/{id}/move:
    post:
      operationId: moveDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteMoveRequest' }
      responses:
        '200':
          description: Reordered notes for the date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }

  /api/v1/tasks:
    get:
      operationId: listTasks
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200':
          description: Created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTaskDetails
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Authoritative task details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
    patch:
      operationId: updateTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Updated task }
    delete:
      operationId: deleteTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }
  /api/v1/tasks/{taskId}/subtasks/{subtaskId}:
    patch:
      operationId: updateSubtask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: subtaskId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: Updated parent task with ordered subtasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /api/v1/tasks/metadata:
    get:
      operationId: taskMetadata
      responses:
        '200':
          description: Saved task categories and tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskMetadata' }
  /api/v1/tasks/legacy-deadline-migration/preview:
    get:
      operationId: previewLegacyTaskDeadlineMigration
      parameters:
        - in: query
          name: sourceTimezone
          required: true
          schema: { type: string, example: Asia/Yekaterinburg }
      responses:
        '200':
          description: Timed legacy tasks interpreted in the selected source timezone without writing changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/tasks/legacy-deadline-migration:
    post:
      operationId: migrateLegacyTaskDeadlines
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationRequest' }
      responses:
        '200':
          description: Remaining legacy timed tasks after selected deadlines were frozen as absolute instants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/inbox:
    get:
      operationId: listInbox
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, archived, all], default: open }
      responses:
        '200':
          description: Quick-capture Inbox items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }
    post:
      operationId: captureInboxItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxCreateRequest' }
      responses:
        '201':
          description: Captured Inbox item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
  /api/v1/inbox/{id}:
    patch:
      operationId: updateInboxItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxUpdateRequest' }
      responses:
        '200': { description: Updated Inbox item }
    delete:
      operationId: deleteInboxItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }
  /api/v1/inbox/{id}/task:
    post:
      operationId: convertInboxItemToTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxToTaskRequest' }
      responses:
        '200':
          description: Archived Inbox item and created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversion' }
  /api/v1/important-days:
    get:
      operationId: listImportantDays
      responses:
        '200':
          description: Important dates, events and periods
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImportantEvent' } }
    post:
      operationId: createImportantDay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportantEventInput' }
      responses:
        '200':
          description: Created important event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportantEvent' }
  /api/v1/important-days/occurrences:
    get:
      operationId: listImportantDayOccurrences
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Projected occurrences }
  /api/v1/overtime/account:
    get:
      operationId: overtimeAccount
      description: Full overtime account with integer-minute FIFO provenance.
      responses:
        '200':
          description: Overtime account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvertimeAccount' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/preview:
    post:
      operationId: previewOvertimeCredit
      description: Canonical server-side interval preview in the user's IANA timezone. Uses the same deterministic DST gap/overlap policy as persisted credit creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeCreditCreateRequest' }
      responses:
        '200':
          description: Canonical interval preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvertimeCreditPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/summary:
    get:
      operationId: overtimeSummary
      description: Compatibility summary calculated from current-timezone projected credit/allocation slices; legacy day-entry hour columns are ignored.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Projected range summary }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/ledger:
    get:
      operationId: overtimeLedger
      description: Compatibility daily ledger grouped by current local projection date. FIFO and persisted source rows are not rewritten.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Current-timezone daily ledger }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/legacy-credits/preview:
    post:
      operationId: previewLegacyOvertimeMigration
      description: Preview attaching legacy local overtime rows to an explicit IANA timezone without changing hours or balance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyOvertimeMigrationRequest' }
      responses:
        '200':
          description: Migration preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOvertimeMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/legacy-credits/migrate:
    post:
      operationId: migrateLegacyOvertimeCredits
      description: Persist exact instants for selected legacy rows and deterministically rebuild FIFO allocations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyOvertimeMigrationRequest' }
      responses:
        '200':
          description: Migration result and rebuilt account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOvertimeMigrationResult' }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/shift-types:
    get: { operationId: listShiftTypes, responses: { '200': { description: Shift types } } }
  /api/v1/profile:
    get: { operationId: getProfile, responses: { '200': { description: Profile } } }
    put: { operationId: updateProfile, responses: { '200': { description: Updated profile } } }
  /api/v1/time/context:
    get:
      operationId: getTimeContext
      description: Returns one absolute server instant in the user's canonical IANA timezone. Legacy work/display fields are identical.
      responses:
        '200':
          description: Current time context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeContext' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/notifications/settings:
    get: { operationId: notificationSettings, responses: { '200': { description: Notification settings } } }
    patch: { operationId: updateNotificationSettings, responses: { '200': { description: Updated notification settings } } }
  /api/v1/quick-scenarios:
    get:
      operationId: quickScenarios
      responses:
        '200':
          description: Quick scenarios with signed FIXED_TIME day offsets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuickScenario' }
  /api/v1/export/notes:
    get:
      operationId: exportNotes
      responses:
        '200':
          description: ZIP archive with Markdown notes
          content:
            application/zip:
              schema: { type: string, format: binary }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    ApiError:
      description: Stable machine-readable error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message, error, timestamp]
      properties:
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        error: { type: string, description: Legacy alias of message }
        fields:
          type: object
          additionalProperties: { type: string }
        moduleKey:
          type: string
          nullable: true
          description: Disabled module key when code is MODULE_DISABLED
          example: notifications
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    TimeContext:
      type: object
      required: [nowInstant, workTimezone, displayTimezone, workLocalDateTime, displayLocalDateTime, workDate, displayDate, workOffset, displayOffset, sameTimezone]
      properties:
        nowInstant: { type: string, format: date-time, description: Absolute UTC instant }
        workTimezone: { type: string, example: Europe/Chisinau }
        displayTimezone: { type: string, example: Europe/Chisinau, description: Compatibility alias of workTimezone }
        workLocalDateTime: { type: string, example: '2026-07-25T15:30:00' }
        displayLocalDateTime: { type: string, example: '2026-07-25T14:30:00' }
        workDate: { type: string, format: date }
        displayDate: { type: string, format: date }
        workOffset: { type: string, example: '+03:00' }
        displayOffset: { type: string, example: '+02:00' }
        sameTimezone: { type: boolean, enum: [true] }
    Task:
      type: object
      required: [id, date, text, done, tags, priority, reminderEnabled, overdue, subtasks, deadlineAbsolute]
      properties:
        id: { type: integer, format: int64 }
        date: { type: string, format: date }
        text: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 4000, nullable: true }
        done: { type: boolean }
        category: { type: string, maxLength: 80, nullable: true, description: Normalised to lower case }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 40 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        dueDate: { type: string, format: date, nullable: true }
        dueTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true }
        deadlineAbsolute: { type: boolean, description: True when dueDate/dueTime are a projection of a persisted absolute instant }
        dueSourceTimezone: { type: string, nullable: true, example: Asia/Yekaterinburg }
        dueSourceDate: { type: string, format: date, nullable: true }
        dueSourceTime: { type: string, nullable: true }
        reminderEnabled: { type: boolean }
        reminderMinutesBefore: { type: integer, minimum: 0, maximum: 10080, nullable: true }
        overdue: { type: boolean }
        subtasks:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskSubtask' }
    TaskSubtask:
      type: object
      required: [id, text, done, sortOrder]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, minLength: 1, maxLength: 300 }
        done: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        dueDate: { type: string, format: date, nullable: true }
    TaskSubtaskInput:
      type: object
      required: [text]
      properties:
        id: { type: integer, format: int64, nullable: true }
        text: { type: string, minLength: 1, maxLength: 300 }
        done: { type: boolean, default: false }
        sortOrder: { type: integer, minimum: 0 }
        dueDate: { type: string, format: date, nullable: true }
    TaskCreateRequest:
      type: object
      required: [date, text]
      properties:
        date: { type: string, format: date }
        text: { type: string, maxLength: 500 }
