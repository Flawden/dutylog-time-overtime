      operationId: deletePayrollCompensationTerm
      description: Removes the compensation term that starts in this month. Earlier terms may become effective again.
      parameters:
        - in: path
          name: month
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '204': { description: Compensation term removed }

