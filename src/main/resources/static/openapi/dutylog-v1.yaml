        - { in: path, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Payroll Foundation workspace payload with no-store caching
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollPeriod' }
