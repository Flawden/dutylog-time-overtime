          enum: [HARMFUL_CONDITIONS, COMBINATION, MONTHLY_BONUS, ONE_TIME_BONUS, REGIONAL_COEFFICIENT]
        calculationType:
          type: string
          enum: [FIXED_AMOUNT, PERCENT_OF_BASE]
        calculationBase:
          type: string
          enum: [NOMINAL_SALARY, EARNED_BASE_PAY]
        rateBps:
          type: integer
        amountMinor:
          type: integer
          format: int64
        currencyCode:
          type: string
        enabled:
          type: boolean
