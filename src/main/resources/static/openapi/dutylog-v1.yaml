openapi: 3.0.3
info:
  title: DutyLog API
  version: 1.0.0
  description: |
    Stable v1 contract for DutyLog generated and typed clients. Existing fields are additive-only.
    Breaking changes require a new /api/v2 namespace.
servers:
  - url: https://app.example.com
security:
  - bearerAuth: []
paths:
  /api/v1/mobile/auth/registration-status:
    get:
      security: []
      operationId: registrationStatus
      responses:
        '200':
          description: Public registration switch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/mobile/auth/register:
    post:
      security: []
      operationId: registerMobileUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRegisterRequest'
      responses:
        '201':
          description: User and first mobile session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/login:
    post:
      security: []
      operationId: loginMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      responses:
        '200':
          description: New access and refresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '401': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/refresh:
    post:
      security: []
      operationId: refreshMobileToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/logout:
    post:
      security: []
      operationId: logoutMobile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, nullable: true }
      responses:
        '204': { description: Session revoked when a matching token is supplied }
  /api/v1/mobile/auth/me:
    get:
      operationId: mobileMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUser'
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/auth/sessions:
    get:
      operationId: listMobileSessions
      responses:
        '200':
          description: Mobile devices/sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MobileSession' }
  /api/v1/mobile/auth/sessions/{id}:
    delete:
      operationId: revokeMobileSession
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/bootstrap:
    get:
      operationId: mobileBootstrap
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Profile and calendar aggregate for the requested range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileBootstrap'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/mobile/sync:
    post:
      operationId: syncMobileQueue
      description: |
        Applies idempotent offline operations. Reusing operationId returns
        ALREADY_APPLIED (or the original conflict/rejection) and never repeats a write.
        Version 0 means the target day does not exist; persisted rows start at version 1.
        A day object without any mutation is rejected with NO_CHANGES.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileSyncRequest'
      responses:
        '200':
          description: Per-operation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSyncResponse'
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/modules:
    get:
      operationId: listModules
      responses:
        '200':
          description: User module contracts and enabled state
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Module' } }
        '401': { $ref: '#/components/responses/ApiError' }
    patch:
      operationId: updateModules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuleSettingsUpdateRequest' }
      responses:
        '200':
          description: Updated module state
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Module' } }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/calendar:
    get:
      operationId: calendarRange
      description: Calendar aggregate including immutable dated shift occurrences projected into the current user timezone.
      responses:
        '200': { description: Calendar aggregate }
  /api/v1/shifts/legacy-migration/preview:
    get:
      operationId: previewLegacyShiftMigration
      parameters:
        - in: query
          name: sourceTimezone
          required: true
          schema: { type: string, example: Asia/Yekaterinburg }
      responses:
        '200':
          description: Legacy dated shifts interpreted in the selected source timezone without writing changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyShiftMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/shifts/legacy-migration:
    post:
      operationId: migrateLegacyShifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyShiftMigrationRequest' }
      responses:
        '200':
          description: Remaining legacy shifts after the selected occurrences were frozen as absolute intervals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyShiftMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/days/{date}:
    put:
      operationId: upsertDay
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: Updated day }
  /api/v1/notes:
    get:
      operationId: listDayNotes
      description: Lists independent notes for one date or an inclusive date range.
      parameters:
        - { in: query, name: date, required: false, schema: { type: string, format: date } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Ordered notes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }
        '400': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createDayNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteCreateRequest' }
      responses:
        '201':
          description: Created independent note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayNote' }
  /api/v1/notes/search:
    get:
      operationId: searchDayNotes
      description: Owner-scoped title/content search with optional inclusive date range.
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 40 } }
      responses:
        '200':
          description: Matching notes newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }
        '400': { $ref: '#/components/responses/ApiError' }
  /api/v1/notes/{id}:
    patch:
      operationId: updateDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteUpdateRequest' }
      responses:
        '200':
          description: Updated note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayNote' }
        '404': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/v1/notes/{id}/move:
    post:
      operationId: moveDayNote
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayNoteMoveRequest' }
      responses:
        '200':
          description: Reordered notes for the date
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DayNote' } }

  /api/v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - { in: query, name: date, required: false, schema: { type: string, format: date } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Tasks for one day or an inclusive range
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Task' } }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '200':
          description: Created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /api/v1/tasks/board:
    get:
      operationId: taskBoard
      parameters:
        - { in: query, name: status, required: false, schema: { type: string, enum: [open, overdue, done, all], default: open } }
        - { in: query, name: category, required: false, schema: { type: string } }
        - { in: query, name: project, required: false, schema: { type: string } }
        - { in: query, name: priority, required: false, schema: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] } }
        - { in: query, name: q, required: false, schema: { type: string } }
        - { in: query, name: from, required: false, schema: { type: string, format: date } }
        - { in: query, name: to, required: false, schema: { type: string, format: date } }
        - { in: query, name: scheduledFrom, required: false, schema: { type: string, format: date } }
        - { in: query, name: scheduledTo, required: false, schema: { type: string, format: date } }
        - { in: query, name: page, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Filtered task board page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTaskDetails
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Authoritative task details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
    patch:
      operationId: updateTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
    delete:
      operationId: deleteTask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }
  /api/v1/tasks/{taskId}/subtasks/{subtaskId}:
    patch:
      operationId: updateSubtask
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: subtaskId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: Updated parent task with ordered subtasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
  /api/v1/tasks/metadata:
    get:
      operationId: taskMetadata
      responses:
        '200':
          description: Saved task categories and tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskMetadata' }
  /api/v1/tasks/legacy-deadline-migration/preview:
    get:
      operationId: previewLegacyTaskDeadlineMigration
      parameters:
        - in: query
          name: sourceTimezone
          required: true
          schema: { type: string, example: Asia/Yekaterinburg }
      responses:
        '200':
          description: Timed legacy tasks interpreted in the selected source timezone without writing changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/tasks/legacy-deadline-migration:
    post:
      operationId: migrateLegacyTaskDeadlines
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationRequest' }
      responses:
        '200':
          description: Remaining legacy timed tasks after selected deadlines were frozen as absolute instants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyTaskDeadlineMigrationPreview' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/inbox:
    get:
      operationId: listInbox
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, archived, all], default: open }
      responses:
        '200':
          description: Quick-capture Inbox items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }
    post:
      operationId: captureInboxItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxCreateRequest' }
      responses:
        '201':
          description: Captured Inbox item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
  /api/v1/inbox/{id}:
    patch:
      operationId: updateInboxItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxUpdateRequest' }
      responses:
        '200': { description: Updated Inbox item }
    delete:
      operationId: deleteInboxItem
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Deleted }
  /api/v1/inbox/{id}/task:
    post:
      operationId: convertInboxItemToTask
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxToTaskRequest' }
      responses:
        '200':
          description: Archived Inbox item and created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxConversion' }
  /api/v1/important-days:
    get:
      operationId: listImportantDays
      responses:
        '200':
          description: Important dates, events and periods
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImportantEvent' } }
    post:
      operationId: createImportantDay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportantEventInput' }
      responses:
        '200':
          description: Created important event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportantEvent' }
  /api/v1/important-days/{id}:
    patch:
      operationId: updateImportantDay
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportantEventInput' }
      responses:
        '200':
          description: Updated important event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportantEvent' }
    delete:
      operationId: deleteImportantDay
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
  /api/v1/important-days/occurrences:
    get:
      operationId: listImportantDayOccurrences
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Projected occurrences
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImportantEventOccurrence' } }
  /api/v1/overtime/account:
    get:
      operationId: overtimeAccount
      description: Full overtime account with integer-minute FIFO provenance.
      responses:
        '200':
          description: Overtime account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvertimeAccount' }
        '401': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/settlements:
    get:
      operationId: listOvertimeSettlements
      description: Lists explicit decisions to consume Time Bank minutes for future monetary settlement. No price or payroll amount is calculated at this layer.
      responses:
        '200':
          description: Overtime settlements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OvertimeSettlement' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: createOvertimeSettlement
      description: Consumes the canonical Time Bank through the existing FIFO and records an explicit future cash-settlement decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeSettlementUpsertRequest' }
      responses:
        '200':
          description: Created settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvertimeSettlement' }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }

  /api/v1/overtime/settlements/{id}:
    patch:
      operationId: updateOvertimeSettlement
      description: Changes an explicit settlement while the accounting period remains open and rebuilds the same canonical FIFO.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeSettlementUpsertRequest' }
      responses:
        '200':
          description: Updated settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OvertimeSettlement' }
        '400': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteOvertimeSettlement
      description: Deletes an open-period settlement and restores only its canonical Time Bank debit.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Settlement deleted and its bank debit restored }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }

  /api/v1/overtime/credits:
    post:
      operationId: createOvertimeCredit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeCreditCreateRequest' }
      responses:
        '200': { description: Rebuilt overtime account, content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeAccount' } } } }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/credits/{id}:
    patch:
      operationId: updateOvertimeCredit
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OvertimeCreditUpdateRequest' }
      responses:
        '200': { description: Rebuilt overtime account, content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeAccount' } } } }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
    delete:
      operationId: deleteOvertimeCredit
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Rebuilt overtime account, content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeAccount' } } } }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/usages:
    post:
      operationId: retiredCreateManualOvertimeUsage
      deprecated: true
      description: Direct usage creation was retired in v27.31.0 and returns DIRECT_USAGE_RETIRED. Create a TIME_OFF absence with compensationPolicy OVERTIME_BANK instead; the FIFO usage is linked automatically.
      responses:
        '409': { $ref: '#/components/responses/ApiError' }
  /api/v1/overtime/usages/{id}:
    patch:
      operationId: retiredUpdateManualOvertimeUsage
      deprecated: true
      description: Legacy MANUAL usages return LEGACY_USAGE_MUST_BE_MIGRATED and must first be promoted into the canonical absence ledger, then edited through Vacation Planner.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
    delete:
