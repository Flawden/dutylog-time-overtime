          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
    PayrollCompensationComponentLine:
      type: object
      description: Frozen/live explainability line for one generic compensation component. displayName is user-owned text and carries no machine semantics; earningKind is nullable machine provenance.
      required: [componentId, versionId, effectiveMonth, displayName, earningKind, calculationType, referenceBaseMinor, amountMinor]
      properties:
        componentId:
          type: integer
          format: int64
        versionId:
          type: integer
          format: int64
        effectiveMonth:
          type: string
          pattern: '^\d{4}-\d{2}$'
        displayName:
          type: string
        earningKind:
          type: string
          nullable: true
          description: Machine semantic provenance. Null means explicitly UNCLASSIFIED.
          enum: [HARMFUL_CONDITIONS, COMBINATION, MONTHLY_BONUS, ONE_TIME_BONUS, REGIONAL_COEFFICIENT]
        calculationType:
          type: string
          enum: [FIXED_AMOUNT, PERCENT_OF_BASE]
        calculationBase:
          type: string
          nullable: true
          enum: [NOMINAL_SALARY, EARNED_BASE_PAY]
        rateBps:
          type: integer
          nullable: true
        configuredAmountMinor:
          type: integer
          format: int64
          nullable: true
        configuredCurrencyCode:
          type: string
          nullable: true
          pattern: '^[A-Z]{3}$'
        referenceBaseMinor:
          type: integer
          format: int64
          minimum: 0
        amountMinor:
          type: integer
          format: int64
          minimum: 0

    PayrollMoneyProjection:
      type: object
      description: Canonical Payroll time and money projection shared by live preview and immutable revision snapshots.
      required: [month, currencyCode, hourlyRateMinor, plannedMinutes, workedMinutes, vacationMinutes, sickMinutes, overtimeCompensatedMinutes, unpaidMinutes, timeAdjustmentMinutes, paidAbsenceMinutes, payableMinutes, hourlyBasePayableMinutes, basePayMinor, compensationComponentCount, compensationComponentEarningsMinor, compensationComponentFingerprint, compensationComponentLines, settlementCount, settlementMinutes, settlementBasePayMinor, settlementPremiumPayMinor, settlementPayMinor, settlementPricingFingerprint, additionsMinor, deductionsMinor, totalPayMinor, effectiveHourlyRateMinor, productionNormMinutes, salaryCoveredMinutes]
      properties:
        month:
          type: string
        currencyCode:
          type: string
        hourlyRateMinor:
          type: integer
          format: int64
          description: Effective hourly value; derived from salary and production norm in SALARY mode.
        plannedMinutes:
          type: integer
        workedMinutes:
          type: integer
        vacationMinutes:
          type: integer
        sickMinutes:
          type: integer
        overtimeCompensatedMinutes:
          type: integer
        unpaidMinutes:
          type: integer
        timeAdjustmentMinutes:
          type: integer
        paidAbsenceMinutes:
          type: integer
        payableMinutes:
          type: integer
          description: Canonical payable time before HOURLY bank-first base separation.
        hourlyBasePayableMinutes:
          type: integer
          minimum: 0
          description: Minutes eligible for ordinary HOURLY base pay. Explicit banked overtime is excluded until settlement.
        basePayMinor:
          type: integer
          format: int64
        compensationComponentCount:
          type: integer
          minimum: 0
          description: Number of enabled generic compensation components participating in this projection.
        compensationComponentEarningsMinor:
          type: integer
          format: int64
          minimum: 0
          description: Generic compensation earnings added as their own Payroll phase, outside manual additions.
        compensationComponentFingerprint:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: Deterministic identity of the resolved generic compensation projection; null when no enabled component participates.
        compensationComponentLines:
          type: array
          description: Explainability lines for generic compensation components. Snapshot instances return frozen lines rather than mutable configuration.
          items:
            $ref: '#/components/schemas/PayrollCompensationComponentLine'
        settlementCount:
          type: integer
          minimum: 0
          description: Number of explicit overtime cash settlements included by settlementDate in this Payroll month.
        settlementMinutes:
          type: integer
          minimum: 0
        settlementBasePayMinor:
          type: integer
          format: int64
          minimum: 0
          description: Base 1.0x monetary component of explicit overtime settlements.
        settlementPremiumPayMinor:
          type: integer
          format: int64
          minimum: 0
          description: Resolved premium component of explicit overtime settlements.
        settlementPayMinor:
          type: integer
          format: int64
          minimum: 0
          description: Total explicit overtime settlement money included in Payroll.
        settlementPricingFingerprint:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: Deterministic SHA-256 identity of the exact settlement provenance, historical compensation and resolved pricing inputs. Null when there are no settlements.
        additionsMinor:
          type: integer
          format: int64
        deductionsMinor:
          type: integer
          format: int64
        totalPayMinor:
          type: integer
          format: int64
          description: Base pay plus explicit settlement pay plus manual additions minus deductions.
        payMode:
          type: string
          nullable: true
          enum: [HOURLY, SALARY]
        compensationEffectiveMonth:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
        configuredHourlyRateMinor:
          type: integer
          format: int64
          nullable: true
        monthlySalaryMinor:
          type: integer
          format: int64
          nullable: true
        effectiveHourlyRateMinor:
          type: integer
          format: int64
        productionNormMinutes:
          type: integer
        salaryCoveredMinutes:
          type: integer

    PayrollPreview:
      allOf:
        - $ref: '#/components/schemas/PayrollMoneyProjection'
        - type: object
          required: [compensationComponentCalculationReady, compensationComponentCalculationBlockingReason, ordinaryPremiumPricingReady, ordinaryPremiumPricingBlockingReason, ordinaryPremiumPricingIdentityRequired, ordinaryPremiumMinutes, ordinaryPremiumReferenceBasePayMinor, ordinaryPremiumPayMinor, settlementPricingReady, settlementPricingBlockingReason]
          properties:
            compensationComponentCalculationReady:
              type: boolean
              description: False when an enabled generic compensation component cannot be valued safely for this Payroll preview.
            compensationComponentCalculationBlockingReason:
              type: string
              nullable: true
              enum: [PAYROLL_COMPENSATION_REQUIRED, PAYROLL_PRODUCTION_NORM_INCOMPLETE, PAYROLL_PRODUCTION_NORM_REQUIRED, PAYROLL_COMP_COMPONENT_CURRENCY_MISMATCH, PAYROLL_COMP_COMPONENT_BASE_UNAVAILABLE, PAYROLL_COMP_COMPONENT_INVALID]
              description: Exact fail-closed reason for generic compensation projection readiness.
            ordinaryPremiumPricingReady:
              type: boolean
              description: False when ordinary-work NIGHT / HOLIDAY premium money cannot be valued safely from canonical source truth and effective-dated rules.
            ordinaryPremiumPricingBlockingReason:
              type: string
              nullable: true
              enum: [ORDINARY_PREMIUM_SOURCE_NOT_READY, PAY_PRICING_RULES_REQUIRED, PAYROLL_COMPENSATION_REQUIRED, PAYROLL_PRODUCTION_NORM_INCOMPLETE, PAYROLL_PRODUCTION_NORM_REQUIRED, PAY_PRICING_CURRENCY_MISMATCH, PAYROLL_ORDINARY_PREMIUM_CURRENCY_MISMATCH]
              description: Exact fail-closed reason when ordinaryPremiumPricingReady is false.
            ordinaryPremiumPricingIdentityRequired:
              type: boolean
              description: True when effective-dated ordinary premium pricing participated and immutable snapshot identity is therefore required, even if the resulting premium is zero.
            ordinaryPremiumMinutes:
              type: integer
              minimum: 0
              description: Canonical ordinary-work minutes considered by the NIGHT / HOLIDAY premium projection.
            ordinaryPremiumReferenceBasePayMinor:
              type: integer
              format: int64
              minimum: 0
              description: Reference ordinary base money used for premium explainability only. This amount is already covered by Payroll base pay and must not be added again.
            ordinaryPremiumPayMinor:
              type: integer
              format: int64
              minimum: 0
              description: Additive ordinary-work NIGHT / HOLIDAY premium delta included in live Payroll total pay.
            settlementPricingReady:
              type: boolean
              description: False when settlement money cannot be valued safely from canonical historical provenance/rules.
            settlementPricingBlockingReason:
              type: string
              nullable: true
              enum: [PAY_PRICING_PROVENANCE_REQUIRED, PAY_PRICING_RULES_REQUIRED, PAYROLL_COMPENSATION_REQUIRED, PAYROLL_PRODUCTION_NORM_INCOMPLETE, PAYROLL_PRODUCTION_NORM_REQUIRED, PAY_PRICING_CURRENCY_MISMATCH, PAYROLL_SETTLEMENT_CURRENCY_MISMATCH]
              description: Exact fail-closed reason when settlementPricingReady is false.

    PayrollSnapshot:
      allOf:
        - $ref: '#/components/schemas/PayrollMoneyProjection'
        - type: object
          required: [id, revision, ordinaryPremiumMinutes, ordinaryPremiumReferenceBasePayMinor, ordinaryPremiumPayMinor, ordinaryPremiumPricingFingerprint, sourcePeriodClosedAt, sourceIntegrityCheckedAt, calculationHash, createdAt]
          properties:
            ordinaryPremiumMinutes:
              type: integer
              minimum: 0
              description: Canonical ordinary-work minutes frozen with this Payroll revision for NIGHT / HOLIDAY premium explainability.
            ordinaryPremiumReferenceBasePayMinor:
              type: integer
              format: int64
              minimum: 0
              description: Frozen reference ordinary base money. Explainability only; it is already represented by basePayMinor and must not be added again.
            ordinaryPremiumPayMinor:
              type: integer
              format: int64
              minimum: 0
              description: Frozen additive ordinary-work NIGHT / HOLIDAY premium delta included in totalPayMinor.
            ordinaryPremiumPricingFingerprint:
              type: string
              nullable: true
              pattern: '^[0-9a-f]{64}$'
              description: Deterministic deep source, pricing-policy and historical-rate identity. Null when no ordinary premium pricing identity participated.
            id:
              type: integer
              format: int64
            revision:
              type: integer
              minimum: 1
            sourcePeriodClosedAt:
              type: string
              format: date-time
            sourceIntegrityCheckedAt:
              type: string
              format: date-time
            calculationHash:
              type: string
              pattern: '^[0-9a-f]{64}$'
            createdAt:
              type: string
