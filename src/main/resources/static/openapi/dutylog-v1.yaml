          description: Exclusive overtime tier end offset. Must be null for NIGHT and HOLIDAY.
        exclusiveGroup:
          type: string
          maxLength: 80
          nullable: true
          description: Rules in one non-null group compete; the highest configured premium wins. Null rules stack independently.
    PayPricingTermInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/PayPricingRule' }
    PayPricingTerm:
      allOf:
        - $ref: '#/components/schemas/PayPricingTermInput'
