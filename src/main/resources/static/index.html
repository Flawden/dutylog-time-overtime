<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журнал смен</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14171C">
<style>
  :root {
    --bg:#14171C; --panel:#1C2027; --panel2:#22262E; --line:#2E333C;
    --text:#E8EAED; --mut:#8B929E; --dim:#5A6270; --accent:#F5B841; --danger:#E0653A;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  .mono { font-family: ui-monospace,'Cascadia Mono',Consolas,monospace; }
  .wrap { max-width:1120px; margin:0 auto; padding:20px 16px 40px; }
  button { font-family:inherit; }

  /* Шапка */
  .head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .eyebrow { font-size:11px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; font-family:ui-monospace,monospace; }
  h1 { font-size:28px; font-weight:800; margin:0; }
  h1 .yr { color:var(--mut); font-weight:400; font-family:ui-monospace,monospace; }
  #saveState { font-size:11px; color:var(--dim); font-family:ui-monospace,monospace; margin-left:12px; }
  #saveState.err { color:var(--danger); }
  .nav button { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 13px; font-size:14px; cursor:pointer; margin-left:8px; }
  .nav button:hover { border-color:var(--dim); }

  /* Сетка */
  .layout { display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
  .layout.with-panel { grid-template-columns:minmax(0,1fr) minmax(300px,380px); }
  @media (max-width: 860px) { .layout.with-panel { grid-template-columns:1fr; } }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }

  .wd { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .wd div { text-align:center; font-size:11px; letter-spacing:1px; color:var(--dim); padding:4px 0; font-family:ui-monospace,monospace; }
  .wd div.we { color:#B08856; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }

  .cell { position:relative; min-height:74px; border-radius:10px; text-align:left; padding:6px 8px;
    background:var(--panel2); border:1px solid var(--line); cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between; gap:2px;
    transition: transform .08s ease; color:var(--text); }
  .cell:hover { transform:translateY(-1px); }
  .cell:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .cell.empty { background:transparent; border:none; cursor:default; }
  .cell.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .cell .num { font-size:14px; font-weight:500; font-family:ui-monospace,monospace; }
  .cell .num.today { color:var(--accent); font-weight:800; }
  .cell .num.today::after { content:"СЕГОДНЯ"; font-size:9px; margin-left:4px; letter-spacing:1px; }
  .cell .shift { font-size:11px; font-weight:600; line-height:1.15; }
  .cell .bar { position:absolute; left:0; top:0; bottom:0; width:4px; }
  .cell .ear { position:absolute; top:0; right:0; width:0; height:0; border-left:14px solid transparent; }
  @media (prefers-reduced-motion: reduce) { .cell { transition:none; } }

  .sum { border-top:1px solid var(--line); margin-top:12px; padding-top:10px;
    display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12.5px; color:var(--mut); }
  .sum .lbl { font-size:11px; letter-spacing:1px; color:var(--dim); text-transform:uppercase; font-family:ui-monospace,monospace; }
  .sum .dot { width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px; }
  .sum b { color:var(--text); }
  .sum .hrs { margin-left:auto; color:var(--accent); font-family:ui-monospace,monospace; }

  /* Панель дня */
  #panel { position:sticky; top:12px; }
  .pt { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .pt .d { font-size:20px; font-weight:700; }
  .pt .close { background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; line-height:1; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .chip { border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .chip .h { opacity:.75; font-weight:400; font-family:ui-monospace,monospace; }
  .chip.plus { background:transparent; color:var(--mut); border:1px dashed var(--dim); font-weight:700; }
  .chip.plus:hover, .chip.plus.open { color:var(--accent); border-color:var(--accent); }

  .linky { background:none; border:none; color:var(--dim); font-size:12px; cursor:pointer; padding:2px 0; text-decoration:underline dotted; }

  .mgr { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; margin:8px 0; }
  .mgr input[type=text] { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--text); padding:6px 9px; font-size:13px; }
  .mgr input.hrs { width:46px; flex:none; text-align:center; font-family:ui-monospace,monospace; }
  .mgr .row { display:flex; gap:6px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .sw { width:20px; height:20px; border-radius:6px; cursor:pointer; border:2px solid transparent; padding:0; }
  .sw.on { border-color:#fff; }
  .mgr input[type=color] { width:26px; height:24px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; cursor:pointer; }
  .mgr .add { margin-left:auto; background:var(--accent); color:#14171C; border:none; border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .mgr .add:disabled { background:var(--line); cursor:default; }
  .mgr .custom { border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; }
  .mgr .custom .del { margin-left:auto; background:none; border:none; color:var(--dim); cursor:pointer; font-size:12px; }
  .mgr .custom .tag { margin-left:auto; color:var(--dim); font-size:11px; font-family:ui-monospace,monospace; }

  .tabs { display:flex; gap:4px; margin:12px 0 8px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:none; cursor:pointer; padding:6px 10px; font-size:13px; color:var(--dim); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs button.on { color:var(--text); font-weight:700; border-bottom-color:var(--accent); }

  #noteEdit { width:100%; min-height:220px; resize:vertical; background:var(--bg); border:1px solid var(--line);
    border-radius:10px; color:var(--text); padding:10px 12px; font-size:13.5px; line-height:1.6;
    font-family:ui-monospace,'Cascadia Mono',Consolas,monospace; }
  #noteEdit::placeholder { color:var(--dim); }
  #notePrev { min-height:220px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px; }
  #notePrev .empty { color:var(--dim); font-size:13px; }

  /* Markdown */
  .mdh { font-weight:700; margin:.6em 0 .3em; line-height:1.25; }
  .mdh1{font-size:1.35rem}.mdh2{font-size:1.18rem}.mdh3{font-size:1.05rem}.mdh4{font-size:.95rem;color:var(--mut)}
  .mdp { margin:.35em 0; line-height:1.55; }
  .mdul,.mdol { margin:.35em 0 .35em 1.3em; line-height:1.55; }
  .mdul{list-style:disc}.mdol{list-style:decimal}
  .mdc { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:.08em .35em; font-family:ui-monospace,monospace; font-size:.88em; color:var(--accent); }
  .mdpre { background:#10131A; border:1px solid var(--line); border-radius:8px; padding:.7em .9em; margin:.5em 0; overflow-x:auto; font-size:.85rem; line-height:1.5; }
  .mdpre code { font-family:ui-monospace,monospace; color:#C9D1D9; }
  .mdq { border-left:3px solid var(--accent); padding:.15em .8em; margin:.4em 0; color:var(--mut); }
  .mdhr { border:none; border-top:1px solid var(--line); margin:.8em 0; }
  .mda { color:#8AB4F8; }
  .mdtask { list-style:none; margin-left:-1.3em; display:flex; gap:.5em; align-items:baseline; }
  .mdbox { display:inline-flex; width:15px; height:15px; border:1.5px solid var(--dim); border-radius:4px; font-size:10px; align-items:center; justify-content:center; flex:none; transform:translateY(2px); }
  .mdbox.on { background:var(--accent); border-color:var(--accent); color:#14171C; font-weight:700; }
  .mddone { color:var(--dim); text-decoration:line-through; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Журнал смен</div>
      <h1><span id="monthName"></span> <span class="yr" id="yearName"></span><span id="saveState"></span></h1>
    </div>
    <div class="nav" style="display:flex;align-items:center;">
      <button id="prev">‹</button>
      <button id="todayBtn">Сегодня</button>
      <button id="next">›</button>
      <span id="whoami" class="mono" style="margin-left:14px;font-size:12.5px;color:var(--mut)"></span>
      <button id="logout" title="Выйти" style="margin-left:8px;">Выйти</button>
    </div>
  </div>

  <div class="layout" id="layout">
    <div class="card">
      <div class="wd">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div class="we">Сб</div><div class="we">Вс</div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="sum" id="summary"></div>
    </div>

    <div class="card" id="panel" hidden>
      <div class="pt">
        <div>
          <div class="eyebrow" id="pWeekday"></div>
          <div class="d" id="pDate"></div>
        </div>
        <button class="close" id="pClose" aria-label="Закрыть">×</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="mgr" id="mgr" hidden>
        <div class="row">
          <input type="text" id="nsName" placeholder="Название">
          <input type="text" class="hrs" id="nsHours" placeholder="ч" inputmode="numeric">
        </div>
        <div class="row" id="swRow"></div>
        <div class="custom" id="customList" hidden></div>
      </div>
      <div class="tabs">
        <button id="tabEdit" class="on">Заметка</button>
        <button id="tabPrev">Превью</button>
      </div>
      <textarea id="noteEdit" spellcheck="false"
        placeholder="# Заголовок&#10;**жирный**, *курсив*, `код`&#10;- [ ] задача&#10;- список"></textarea>
      <div id="notePrev" hidden></div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ─── Состояние ─────────────────────────────────────────────── */
const state = {
  y: new Date().getFullYear(),
  m: new Date().getMonth(),      // 0–11
  shiftTypes: [],                 // [{id,name,hours,color,builtin}]
  days: {},                       // { 'YYYY-MM-DD': {shiftTypeId, note} }
  selected: null,                 // ключ даты
  tab: "edit",
  swColor: "#F5B841",
};

const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WEEKDAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const SWATCHES = ["#F5B841","#E0653A","#C97BB8","#7B8CE0","#4FA3A5","#6FBF73","#B5A642","#8B929E"];

const pad = n => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
const $ = id => document.getElementById(id);

/* ─── API ───────────────────────────────────────────────────── */
const api = {
  async shiftTypes()        { return jfetch("/api/shift-types"); },
  async createShiftType(b)  { return jfetch("/api/shift-types", { method:"POST", body:b }); },
  async deleteShiftType(id) { return jfetch(`/api/shift-types/${id}`, { method:"DELETE" }); },
  async month(y, m)         { return jfetch(`/api/days?year=${y}&month=${m + 1}`); },
  async upsertDay(k, b)     { return jfetch(`/api/days/${k}`, { method:"PUT", body:b }); },
};

async function jfetch(url, opts = {}) {
  const res = await fetch(url, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    // Сессия истекла или не залогинен — на страницу входа
    window.location.href = "/login.html";
    throw new Error("401: не авторизован");
  }
  if (!res.ok) {
    let msg = `${opts.method || "GET"} ${url} → ${res.status}`;
    try {
      const body = await res.json();
      if (body?.error) msg = body.error;
    } catch (_) { /* ответ был не JSON */ }
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function setSave(s, msg = "") {
  const el = $("saveState");
  el.classList.toggle("err", s === "err");
  el.textContent = s === "saving" ? "сохраняю…" : s === "saved" ? "✓" : s === "err" ? (msg || "ошибка сети") : "";
  if (s === "saved") setTimeout(() => { if (el.textContent === "✓") el.textContent = ""; }, 1500);
}

/* ─── Markdown (мини-парсер) ────────────────────────────────── */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inlineMd(s){
  return s
    .replace(/`([^`]+)`/g, '<code class="mdc">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="mda">$1</a>');
}
function renderMd(src){
  const lines = esc(src).split("\n");
  const out = [];
  let list = null, inCode = false, codeBuf = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of lines) {
    if (raw.trim().startsWith("```")) {
      if (inCode) { out.push(`<pre class="mdpre"><code>${codeBuf.join("\n")}</code></pre>`); codeBuf = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(raw); continue; }
    const h = raw.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push(`<div class="mdh mdh${h[1].length}">${inlineMd(h[2])}</div>`); continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(raw)) { closeList(); out.push('<hr class="mdhr">'); continue; }
    const q = raw.match(/^>\s?(.*)$/);
    if (q) { closeList(); out.push(`<blockquote class="mdq">${inlineMd(q[1])}</blockquote>`); continue; }
    const task = raw.match(/^[-*]\s+\[( |x|X)\]\s+(.*)$/);
    if (task) {
      if (list !== "ul") { closeList(); out.push('<ul class="mdul">'); list = "ul"; }
      const done = task[1].toLowerCase() === "x";
      out.push(`<li class="mdtask"><span class="mdbox${done ? " on" : ""}">${done ? "✓" : ""}</span><span class="${done ? "mddone" : ""}">${inlineMd(task[2])}</span></li>`);
      continue;
    }
    const ul = raw.match(/^[-*]\s+(.*)$/);
    if (ul) { if (list !== "ul") { closeList(); out.push('<ul class="mdul">'); list = "ul"; } out.push(`<li>${inlineMd(ul[1])}</li>`); continue; }
    const ol = raw.match(/^\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== "ol") { closeList(); out.push('<ol class="mdol">'); list = "ol"; } out.push(`<li>${inlineMd(ol[1])}</li>`); continue; }
    closeList();
    if (raw.trim() === "") continue;
    out.push(`<p class="mdp">${inlineMd(raw)}</p>`);
  }
  if (inCode) out.push(`<pre class="mdpre"><code>${codeBuf.join("\n")}</code></pre>`);
  closeList();
  return out.join("");
}

/* ─── Рендер календаря ──────────────────────────────────────── */
function stOf(k){ const e = state.days[k]; return e ? state.shiftTypes.find(s => s.id === e.shiftTypeId) : null; }

function renderCalendar(){
  $("monthName").textContent = MONTHS[state.m];
  $("yearName").textContent = state.y;

  const grid = $("grid");
  grid.innerHTML = "";
  const first = new Date(state.y, state.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const count = new Date(state.y, state.m + 1, 0).getDate();
  const tk = todayKey();

  for (let i = 0; i < offset; i++) {
    const c = document.createElement("div");
    c.className = "cell empty";
    grid.appendChild(c);
  }
  for (let d = 1; d <= count; d++) {
    const k = keyOf(state.y, state.m, d);
    const st = stOf(k);
    const entry = state.days[k];
    const cell = document.createElement("button");
    cell.className = "cell" + (state.selected === k ? " sel" : "");
    if (st) {
      cell.style.background = st.color + "26";
      if (state.selected !== k) cell.style.borderColor = st.color + "55";
      const bar = document.createElement("div");
      bar.className = "bar"; bar.style.background = st.color;
      cell.appendChild(bar);
    }
    if (entry?.note?.trim()) {
      const ear = document.createElement("div");
      ear.className = "ear";
      ear.style.borderTop = `14px solid ${st ? st.color : "var(--dim)"}`;
      ear.title = "Есть заметка";
      cell.appendChild(ear);
    }
    const num = document.createElement("span");
    num.className = "num" + (k === tk ? " today" : "");
    num.textContent = d;
    cell.appendChild(num);
    if (st) {
      const nm = document.createElement("span");
      nm.className = "shift"; nm.style.color = st.color; nm.textContent = st.name;
      cell.appendChild(nm);
    }
    cell.addEventListener("click", () => selectDay(state.selected === k ? null : k));
    grid.appendChild(cell);
  }
  renderSummary();
}

function renderSummary(){
  const counts = {}; let hours = 0;
  for (const [k, v] of Object.entries(state.days)) {
    if (!v.shiftTypeId) continue;
    counts[v.shiftTypeId] = (counts[v.shiftTypeId] || 0) + 1;
    const st = state.shiftTypes.find(s => s.id === v.shiftTypeId);
    if (st?.hours) hours += Number(st.hours);
  }
  const el = $("summary");
  el.innerHTML = '<span class="lbl">Итого:</span>';
  let any = false;
  for (const s of state.shiftTypes) {
    if (!counts[s.id]) continue;
    any = true;
    const span = document.createElement("span");
    span.innerHTML = `<span class="dot" style="background:${s.color}"></span>${esc(s.name)} — <b>${counts[s.id]}</b>`;
    el.appendChild(span);
  }
  if (hours > 0) {
    const h = document.createElement("span");
    h.className = "hrs"; h.textContent = `${hours} ч`;
    el.appendChild(h);
  }
  if (!any) {
    const s = document.createElement("span");
    s.style.color = "var(--dim)"; s.textContent = "смены пока не отмечены — тыкни в день";
    el.appendChild(s);
  }
}

/* ─── Панель дня ────────────────────────────────────────────── */
function selectDay(k){
  state.selected = k;
  $("layout").classList.toggle("with-panel", !!k);
  $("panel").hidden = !k;
  if (k) {
    const [y, m, d] = k.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    $("pWeekday").textContent = WEEKDAYS[(date.getDay() + 6) % 7];
    $("pDate").innerHTML = `${d} ${MONTHS_GEN[m - 1]} <span class="yr mono">${y}</span>`;
    $("noteEdit").value = state.days[k]?.note || "";
    setTab("edit");
    renderChips();
  }
  renderCalendar();
}

function renderChips(){
  const box = $("chips");
  box.innerHTML = "";
  const cur = state.days[state.selected]?.shiftTypeId ?? null;
  for (const s of state.shiftTypes) {
    const b = document.createElement("button");
    const on = cur === s.id;
    b.className = "chip";
    b.style.background = on ? s.color : s.color + "1F";
    b.style.color = on ? "#14171C" : s.color;
    b.style.border = `1px solid ${on ? s.color : s.color + "55"}`;
    b.innerHTML = esc(s.name) + (s.hours ? ` <span class="h">·${s.hours}ч</span>` : "");
    b.addEventListener("click", () => toggleShift(s.id));
    box.appendChild(b);
  }
  // Плюсик — создать свою смену
  const plus = document.createElement("button");
  plus.className = "chip plus" + ($("mgr").hidden ? "" : " open");
  plus.textContent = "+";
  plus.title = "Своя смена";
  plus.addEventListener("click", () => {
    const m = $("mgr");
    m.hidden = !m.hidden;
    plus.classList.toggle("open", !m.hidden);
    if (!m.hidden) $("nsName").focus();
  });
  box.appendChild(plus);
  renderCustomList();
}

async function toggleShift(id){
  const k = state.selected;
  const cur = state.days[k] || {};
  const next = { shiftTypeId: cur.shiftTypeId === id ? null : id, note: cur.note || null };
  applyLocal(k, next);
  renderChips(); renderCalendar();
  await pushDaySnapshot(k, next);
}

function applyLocal(k, next){
  const clean = {
    shiftTypeId: next.shiftTypeId ?? null,
    note: next.note ?? null,
  };
  if (!clean.shiftTypeId && !(clean.note || "").trim()) delete state.days[k];
  else state.days[k] = clean;
}

/*
 * Отправка дня на сервер. Важно: сохраняем снимок данных, а не читаем
 * state.days[k] внутри setTimeout. Иначе можно потерять заметку, если
 * пользователь напечатал текст и сразу переключил месяц.
 */
async function pushDaySnapshot(k, payload){
  setSave("saving");
  try {
    await api.upsertDay(k, {
      shiftTypeId: payload.shiftTypeId ?? null,
      note: payload.note ?? null,
    });
    setSave("saved");
  } catch (err) {
    console.error(err);
    setSave("err", err.message);
  }
}

/* Заметка: локально сразу, на сервер — с задержкой */
let noteTimer = null;
let pendingDaySave = null;

function scheduleDaySave(k, payload){
  clearTimeout(noteTimer);
  pendingDaySave = { k, payload: { ...payload } };
  noteTimer = setTimeout(() => {
    const p = pendingDaySave;
    pendingDaySave = null;
    noteTimer = null;
    if (p) pushDaySnapshot(p.k, p.payload);
  }, 600);
}

async function flushPendingSave(){
  if (!pendingDaySave) return;
  clearTimeout(noteTimer);
  const p = pendingDaySave;
  pendingDaySave = null;
  noteTimer = null;
  await pushDaySnapshot(p.k, p.payload);
}

$("noteEdit").addEventListener("input", () => {
  const k = state.selected;
  if (!k) return;
  const cur = state.days[k] || {};
  const next = { shiftTypeId: cur.shiftTypeId ?? null, note: $("noteEdit").value };
  applyLocal(k, next);
  renderCalendar();
  scheduleDaySave(k, next);
});

function setTab(t){
  state.tab = t;
  $("tabEdit").classList.toggle("on", t === "edit");
  $("tabPrev").classList.toggle("on", t === "preview");
  $("noteEdit").hidden = t !== "edit";
  $("notePrev").hidden = t !== "preview";
  if (t === "preview") {
    const note = $("noteEdit").value;
    $("notePrev").innerHTML = note.trim() ? renderMd(note) : '<span class="empty">Заметка пустая — нечего показывать.</span>';
  }
}
$("tabEdit").addEventListener("click", () => setTab("edit"));
$("tabPrev").addEventListener("click", () => setTab("preview"));
$("pClose").addEventListener("click", () => selectDay(null));

/* ─── Управление типами смен ────────────────────────────────── */

// Enter в полях новой смены = «Добавить» (вешается один раз)
for (const id of ["nsName", "nsHours"]) {
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") addShiftType(); });
}

function renderSwatches(){
  const row = $("swRow");
  row.innerHTML = "";
  for (const c of SWATCHES) {
    const b = document.createElement("button");
    b.className = "sw" + (state.swColor === c ? " on" : "");
    b.style.background = c;
    b.addEventListener("click", () => { state.swColor = c; renderSwatches(); });
    row.appendChild(b);
  }
  const picker = document.createElement("input");
  picker.type = "color"; picker.value = state.swColor; picker.title = "Свой цвет";
  picker.addEventListener("input", () => { state.swColor = picker.value; });
  row.appendChild(picker);
  const add = document.createElement("button");
  add.className = "add"; add.textContent = "Добавить";
  add.addEventListener("click", addShiftType);
  row.appendChild(add);
}

async function addShiftType(){
  const name = $("nsName").value.trim();
  if (!name) return setSave("err", "укажи название смены");
  const rawHours = $("nsHours").value.trim().replace(",", ".");
  const hours = rawHours ? Number(rawHours) : 0;
  if (!Number.isFinite(hours) || hours < 0 || hours > 24) {
    return setSave("err", "часы: от 0 до 24");
  }

  setSave("saving");
  try {
    const created = await api.createShiftType({ name, hours, color: state.swColor });
    state.shiftTypes.push(created);
    $("nsName").value = ""; $("nsHours").value = "";
    setSave("saved");
    renderChips(); renderSummary(); renderCustomList();
  } catch (err) { console.error(err); setSave("err", err.message); }
}

function renderCustomList(){
  const box = $("customList");
  box.hidden = state.shiftTypes.length === 0;
  box.innerHTML = "";
  for (const s of state.shiftTypes) {
    const row = document.createElement("div");
    row.style.display = "flex"; row.style.alignItems = "center"; row.style.gap = "8px";
    row.innerHTML = `<span class="dot" style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block"></span>
      <span>${esc(s.name)}${s.hours ? ` · ${s.hours}ч` : ""}</span>`;
    if (s.builtin) {
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = "встроенная";
      row.appendChild(tag);
    } else {
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "удалить";
      del.title = "Смена снимется с дней, где стояла. Заметки останутся.";
      del.addEventListener("click", () => removeShiftType(s.id));
      row.appendChild(del);
    }
    box.appendChild(row);
  }
}

async function removeShiftType(id){
  setSave("saving");
  try {
    await api.deleteShiftType(id);
    state.shiftTypes = state.shiftTypes.filter(s => s.id !== id);
    // локально снимаем смену с дней, где она стояла
    for (const [k, v] of Object.entries(state.days)) {
      if (v.shiftTypeId === id) {
        v.shiftTypeId = null;
        if (!(v.note || "").trim()) delete state.days[k];
      }
    }
    setSave("saved");
    renderChips(); renderCalendar();
  } catch (err) { console.error(err); setSave("err", err.message); }
}

/* ─── Навигация по месяцам ──────────────────────────────────── */
async function goto(y, m){
  await flushPendingSave();
  const d = new Date(y, m, 1);
  state.y = d.getFullYear(); state.m = d.getMonth();
  state.selected = null;
  $("panel").hidden = true; $("layout").classList.remove("with-panel");
  await loadMonth();
  renderCalendar();
}
$("prev").addEventListener("click", () => goto(state.y, state.m - 1));
$("next").addEventListener("click", () => goto(state.y, state.m + 1));
$("todayBtn").addEventListener("click", async () => {
  const t = new Date();
  await goto(t.getFullYear(), t.getMonth());
  selectDay(todayKey());
});

/* ─── Загрузка данных ───────────────────────────────────────── */
async function loadMonth(){
  try {
    const list = await api.month(state.y, state.m);
    state.days = {};
    for (const e of list) state.days[e.date] = { shiftTypeId: e.shiftTypeId, note: e.note };
    setSave("");
  } catch (err) { console.error(err); setSave("err", err.message); }
}

/* ─── Пользователь ──────────────────────────────────────────── */
$("logout").addEventListener("click", async () => {
  try { await flushPendingSave(); } catch (e) { /* не блокируем выход */ }
  try { await fetch("/logout", { method: "POST" }); } catch (e) { /* пофиг, всё равно уходим */ }
  window.location.href = "/login.html";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
}

async function init(){
  renderSwatches();
  try {
    const me = await jfetch("/api/auth/me");
    $("whoami").textContent = me.username;
    state.shiftTypes = await api.shiftTypes();
  } catch (err) {
    console.error(err);
    setSave("err", err.message);
    return; // при 401 нас уже уносит на login.html
  }
  await loadMonth();
  renderCalendar();
}
init();
</script>
