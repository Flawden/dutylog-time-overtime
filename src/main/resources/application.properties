# --- База данных: H2 в файле рядом с проектом ---
# Данные лежат в ./data/shifts.mv.db и переживают перезапуск.
spring.datasource.url=jdbc:h2:file:./data/shifts
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate сам создаёт/обновляет таблицы по сущностям.
# Для продакшена это меняют на миграции (Flyway/Liquibase) — см. README.
spring.jpa.hibernate.ddl-auto=update

# Веб-консоль БД: http://localhost:8080/h2-console
# JDBC URL в форме входа: jdbc:h2:file:./data/shifts
spring.h2.console.enabled=true

server.port=8080
