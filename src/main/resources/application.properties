# Local dev profile: file-based H2 database next to the project.
# Data is stored in ./data/shifts.mv.db and survives restarts.
# This mode exists for quick IntelliJ runs without Docker.
spring.datasource.url=jdbc:h2:file:./data/shifts
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# In dev Hibernate creates/updates tables from entities.
# In production this is disabled and Flyway migrations own the schema.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# H2 database console: http://localhost:8080/h2-console
# JDBC URL on the login form: jdbc:h2:file:./data/shifts
spring.h2.console.enabled=true

spring.jpa.open-in-view=false
server.port=8080

# Session cookie baseline. In production, application-prod.properties also enables Secure.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Graceful shutdown and public health endpoint.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.show-details=never

# Secure administrator bootstrap. Public registration always creates USER accounts.
# ADMIN is created from env on first start; after that admins can manage roles/passwords in UI.
# Set DUTYLOG_ADMIN_FORCE_PASSWORD_RESET=true only for emergency password recovery from env.
dutylog.admin.username=${DUTYLOG_ADMIN_USERNAME:}
dutylog.admin.password=${DUTYLOG_ADMIN_PASSWORD:}
dutylog.admin.force-password-reset=${DUTYLOG_ADMIN_FORCE_PASSWORD_RESET:false}

# Telegram bot is disabled in local dev by default.
dutylog.telegram.enabled=${DUTYLOG_TELEGRAM_ENABLED:false}
dutylog.telegram.bot-token=${DUTYLOG_TELEGRAM_BOT_TOKEN:}
dutylog.telegram.bot-username=${DUTYLOG_TELEGRAM_BOT_USERNAME:}
dutylog.telegram.polling-enabled=${DUTYLOG_TELEGRAM_POLLING_ENABLED:false}
dutylog.telegram.polling-delay-ms=${DUTYLOG_TELEGRAM_POLLING_DELAY_MS:3000}
dutylog.telegram.command-menu-enabled=${DUTYLOG_TELEGRAM_COMMAND_MENU_ENABLED:true}
dutylog.telegram.command-menu-initial-delay-ms=${DUTYLOG_TELEGRAM_COMMAND_MENU_INITIAL_DELAY_MS:7000}
dutylog.telegram.command-menu-refresh-ms=${DUTYLOG_TELEGRAM_COMMAND_MENU_REFRESH_MS:21600000}

# Telegram reminder delivery. Uses the same rules as browser/Android reminders.
dutylog.telegram.notifications-enabled=${DUTYLOG_TELEGRAM_NOTIFICATIONS_ENABLED:true}
dutylog.telegram.notification-scan-delay-ms=${DUTYLOG_TELEGRAM_NOTIFICATION_SCAN_DELAY_MS:60000}
dutylog.telegram.notification-lookback-minutes=${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKBACK_MINUTES:10}
dutylog.telegram.notification-lookahead-minutes=${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKAHEAD_MINUTES:1}

# v20.3 diagnostics
logging.level.ru.daniil.shifts.config.RequestDiagnosticsFilter=${DUTYLOG_REQUEST_LOG_LEVEL:INFO}

# Application metadata exposed through /actuator/info.
management.info.env.enabled=true
info.app.name=DutyLog: Time & Overtime
info.app.version=${DUTYLOG_BUILD_VERSION:27.26.2}
info.app.release-version=27.26.2
info.app.commit=${DUTYLOG_BUILD_COMMIT:local}
info.app.tree=${DUTYLOG_BUILD_TREE:local}
info.app.environment=${DUTYLOG_ENVIRONMENT:local}
info.app.build-time=${DUTYLOG_BUILD_TIME:unknown}
info.app.deploy-commit=${DUTYLOG_DEPLOY_COMMIT:local}
info.app.deployed-at=${DUTYLOG_DEPLOY_TIME:unknown}
info.app.image=${DUTYLOG_IMAGE_REF:local}
info.app.client=web/PWA + Android API v1 inside Spring Boot monolith

# Local development keeps registration open and rate limiting off for fast iteration.
dutylog.registration.default-enabled=${DUTYLOG_REGISTRATION_DEFAULT_ENABLED:true}
dutylog.security.rate-limit.enabled=${DUTYLOG_SECURITY_RATE_LIMIT_ENABLED:false}
dutylog.security.trust-proxy-headers=${DUTYLOG_SECURITY_TRUST_PROXY_HEADERS:false}
dutylog.security.rate-limit.login-attempts=${DUTYLOG_SECURITY_LOGIN_ATTEMPTS:5}
dutylog.security.rate-limit.login-window-seconds=${DUTYLOG_SECURITY_LOGIN_WINDOW_SECONDS:60}
dutylog.security.rate-limit.registration-attempts=${DUTYLOG_SECURITY_REGISTRATION_ATTEMPTS:5}
dutylog.security.rate-limit.registration-window-seconds=${DUTYLOG_SECURITY_REGISTRATION_WINDOW_SECONDS:3600}

# Bounded notes export. Limits are checked before streaming the ZIP response.
dutylog.export.notes.max-count=${DUTYLOG_EXPORT_NOTES_MAX_COUNT:10000}
dutylog.export.notes.max-uncompressed-bytes=${DUTYLOG_EXPORT_NOTES_MAX_UNCOMPRESSED_BYTES:52428800}

# Android API v1 idempotency ledger. It stores technical operation outcomes, not user content.
dutylog.mobile.sync.idempotency-retention-days=${DUTYLOG_MOBILE_SYNC_RETENTION_DAYS:90}
dutylog.mobile.sync.cleanup-delay-ms=${DUTYLOG_MOBILE_SYNC_CLEANUP_DELAY_MS:86400000}
dutylog.mobile.auth-token.retention-days=${DUTYLOG_MOBILE_AUTH_TOKEN_RETENTION_DAYS:90}
dutylog.mobile.auth-token.cleanup-delay-ms=${DUTYLOG_MOBILE_AUTH_TOKEN_CLEANUP_DELAY_MS:86400000}

# Optional persistent web login. The checkbox on the login page controls issuance.
dutylog.security.remember-me.validity-days=${DUTYLOG_REMEMBER_ME_VALIDITY_DAYS:30}
dutylog.security.remember-me.secure-cookie=${DUTYLOG_REMEMBER_ME_SECURE_COOKIE:false}

# External calendar read-only feed limits. Raw subscription tokens are never persisted.
dutylog.calendar-sync.feed-past-days=30
dutylog.calendar-sync.feed-future-days=335
dutylog.calendar-sync.max-events=10000
dutylog.calendar-sync.max-bytes=5242880
