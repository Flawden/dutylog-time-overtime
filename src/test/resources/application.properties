# Tests use an in-memory H2 database and never touch the local dev file database.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Security boundary tests control authentication directly; disable global counters to avoid cross-test coupling.
dutylog.security.rate-limit.enabled=false
dutylog.registration.default-enabled=true
