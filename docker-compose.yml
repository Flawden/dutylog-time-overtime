services:
  db:
    image: postgres:16-alpine
    container_name: shift-calendar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-shift_calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shift-calendar-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/shift_calendar}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-shift_calendar}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Задай SPRING_DATASOURCE_PASSWORD в .env}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
