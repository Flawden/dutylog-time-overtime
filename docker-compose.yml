services:
  db:
    image: postgres:16-alpine
    container_name: dutylog-db-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-shift_calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dutylog-app-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/shift_calendar}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-shift_calendar}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Задай SPRING_DATASOURCE_PASSWORD в .env}
      DUTYLOG_TELEGRAM_ENABLED: ${DUTYLOG_TELEGRAM_ENABLED:-false}
      DUTYLOG_TELEGRAM_BOT_TOKEN: ${DUTYLOG_TELEGRAM_BOT_TOKEN:-}
      DUTYLOG_TELEGRAM_BOT_USERNAME: ${DUTYLOG_TELEGRAM_BOT_USERNAME:-}
      DUTYLOG_TELEGRAM_POLLING_ENABLED: ${DUTYLOG_TELEGRAM_POLLING_ENABLED:-false}
      DUTYLOG_TELEGRAM_POLLING_DELAY_MS: ${DUTYLOG_TELEGRAM_POLLING_DELAY_MS:-3000}
      DUTYLOG_TELEGRAM_NOTIFICATIONS_ENABLED: ${DUTYLOG_TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      DUTYLOG_TELEGRAM_NOTIFICATION_SCAN_DELAY_MS: ${DUTYLOG_TELEGRAM_NOTIFICATION_SCAN_DELAY_MS:-60000}
      DUTYLOG_TELEGRAM_NOTIFICATION_LOOKBACK_MINUTES: ${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKBACK_MINUTES:-10}
      DUTYLOG_TELEGRAM_NOTIFICATION_LOOKAHEAD_MINUTES: ${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKAHEAD_MINUTES:-1}
      DUTYLOG_REQUEST_LOG_LEVEL: ${DUTYLOG_REQUEST_LOG_LEVEL:-INFO}
      DUTYLOG_REMEMBER_ME_VALIDITY_DAYS: ${DUTYLOG_REMEMBER_ME_VALIDITY_DAYS:-30}
      DUTYLOG_REMEMBER_ME_SECURE_COOKIE: ${DUTYLOG_REMEMBER_ME_SECURE_COOKIE:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres_data:
