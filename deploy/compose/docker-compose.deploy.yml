services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${DUTYLOG_DB_MEMORY_LIMIT:-256m}
    pids_limit: ${DUTYLOG_DB_PIDS_LIMIT:-128}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - database

  app:
    image: ${DUTYLOG_IMAGE:?DUTYLOG_IMAGE must be an immutable registry reference}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    mem_limit: ${DUTYLOG_APP_MEMORY_LIMIT:-640m}
    pids_limit: ${DUTYLOG_APP_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DUTYLOG_ENVIRONMENT: ${DUTYLOG_ENVIRONMENT:?Set DUTYLOG_ENVIRONMENT}
      DUTYLOG_DEPLOY_COMMIT: ${DUTYLOG_DEPLOY_COMMIT:-unknown}
      DUTYLOG_DEPLOY_TIME: ${DUTYLOG_DEPLOY_TIME:-unknown}
      DUTYLOG_IMAGE_REF: ${DUTYLOG_IMAGE}
      DUTYLOG_TELEGRAM_ENABLED: ${DUTYLOG_TELEGRAM_ENABLED:-false}
      DUTYLOG_TELEGRAM_BOT_TOKEN: ${DUTYLOG_TELEGRAM_BOT_TOKEN:-}
      DUTYLOG_TELEGRAM_BOT_USERNAME: ${DUTYLOG_TELEGRAM_BOT_USERNAME:-}
      DUTYLOG_TELEGRAM_POLLING_ENABLED: ${DUTYLOG_TELEGRAM_POLLING_ENABLED:-false}
      DUTYLOG_TELEGRAM_POLLING_DELAY_MS: ${DUTYLOG_TELEGRAM_POLLING_DELAY_MS:-3000}
      DUTYLOG_TELEGRAM_NOTIFICATIONS_ENABLED: ${DUTYLOG_TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      DUTYLOG_TELEGRAM_NOTIFICATION_SCAN_DELAY_MS: ${DUTYLOG_TELEGRAM_NOTIFICATION_SCAN_DELAY_MS:-60000}
      DUTYLOG_TELEGRAM_NOTIFICATION_LOOKBACK_MINUTES: ${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKBACK_MINUTES:-10}
      DUTYLOG_TELEGRAM_NOTIFICATION_LOOKAHEAD_MINUTES: ${DUTYLOG_TELEGRAM_NOTIFICATION_LOOKAHEAD_MINUTES:-1}
      DUTYLOG_REQUEST_LOG_LEVEL: ${DUTYLOG_REQUEST_LOG_LEVEL:-INFO}
      DUTYLOG_ADMIN_USERNAME: ${DUTYLOG_ADMIN_USERNAME:?Set DUTYLOG_ADMIN_USERNAME}
      DUTYLOG_ADMIN_PASSWORD: ${DUTYLOG_ADMIN_PASSWORD:?Set DUTYLOG_ADMIN_PASSWORD}
      DUTYLOG_ADMIN_FORCE_PASSWORD_RESET: ${DUTYLOG_ADMIN_FORCE_PASSWORD_RESET:-false}
      DUTYLOG_REGISTRATION_DEFAULT_ENABLED: ${DUTYLOG_REGISTRATION_DEFAULT_ENABLED:-false}
      DUTYLOG_SECURITY_RATE_LIMIT_ENABLED: ${DUTYLOG_SECURITY_RATE_LIMIT_ENABLED:-true}
      DUTYLOG_SECURITY_TRUST_PROXY_HEADERS: ${DUTYLOG_SECURITY_TRUST_PROXY_HEADERS:-true}
      DUTYLOG_SECURITY_LOGIN_ATTEMPTS: ${DUTYLOG_SECURITY_LOGIN_ATTEMPTS:-5}
      DUTYLOG_SECURITY_LOGIN_WINDOW_SECONDS: ${DUTYLOG_SECURITY_LOGIN_WINDOW_SECONDS:-60}
      DUTYLOG_SECURITY_REGISTRATION_ATTEMPTS: ${DUTYLOG_SECURITY_REGISTRATION_ATTEMPTS:-5}
      DUTYLOG_SECURITY_REGISTRATION_WINDOW_SECONDS: ${DUTYLOG_SECURITY_REGISTRATION_WINDOW_SECONDS:-3600}
      DUTYLOG_EXPORT_NOTES_MAX_COUNT: ${DUTYLOG_EXPORT_NOTES_MAX_COUNT:-10000}
      DUTYLOG_EXPORT_NOTES_MAX_UNCOMPRESSED_BYTES: ${DUTYLOG_EXPORT_NOTES_MAX_UNCOMPRESSED_BYTES:-52428800}
      DUTYLOG_MOBILE_SYNC_RETENTION_DAYS: ${DUTYLOG_MOBILE_SYNC_RETENTION_DAYS:-90}
      DUTYLOG_MOBILE_SYNC_CLEANUP_DELAY_MS: ${DUTYLOG_MOBILE_SYNC_CLEANUP_DELAY_MS:-86400000}
      DUTYLOG_MOBILE_AUTH_TOKEN_RETENTION_DAYS: ${DUTYLOG_MOBILE_AUTH_TOKEN_RETENTION_DAYS:-90}
      DUTYLOG_MOBILE_AUTH_TOKEN_CLEANUP_DELAY_MS: ${DUTYLOG_MOBILE_AUTH_TOKEN_CLEANUP_DELAY_MS:-86400000}
      DUTYLOG_LOG_FILE: ${DUTYLOG_LOG_FILE:-/app/logs/dutylog.log}
      DUTYLOG_LOG_MAX_FILE_SIZE: ${DUTYLOG_LOG_MAX_FILE_SIZE:-10MB}
      DUTYLOG_LOG_MAX_HISTORY: ${DUTYLOG_LOG_MAX_HISTORY:-14}
      DUTYLOG_LOG_TOTAL_SIZE_CAP: ${DUTYLOG_LOG_TOTAL_SIZE_CAP:-200MB}
    volumes:
      - app_logs:/app/logs
    # The host nginx is the only public entry point. Docker publishes DutyLog
    # strictly on loopback, so ports 18082/18083 are unreachable from the Internet.
    ports:
      - "${DUTYLOG_BIND_ADDRESS:-127.0.0.1}:${DUTYLOG_BIND_PORT:?Set DUTYLOG_BIND_PORT in the environment file}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - database
      - outbound

volumes:
  postgres_data:
  app_logs:

networks:
  # PostgreSQL has no route outside this private per-environment network.
  database:
    internal: true
  # The app needs outbound Internet access for optional Telegram delivery.
  # This network is private to the Compose project and publishes no ports itself.
  outbound:
